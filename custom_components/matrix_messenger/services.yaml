# send_message, ask_question und send_to_<raum> werden beim Start dynamisch
# injiziert, damit Räume als lesbares Dropdown erscheinen (siehe __init__.py).

send_to_user:
  name: Matrix-Direktnachricht senden
  description: >
    Sendet eine Direktnachricht an einen einzelnen Matrix-Benutzer.
    Sucht einen vorhandenen DM-Raum oder erstellt automatisch einen neuen.
  fields:
    user_id:
      name: Benutzer-ID
      description: "Matrix-Benutzer-ID (z. B. @max:matrix.org)."
      required: true
      example: "@max:matrix.org"
      selector:
        text:
    message:
      name: Nachricht
      description: Der zu sendende Text.
      required: true
      selector:
        text:
          multiline: true

send_image_to_user:
  name: Matrix-Bild als Direktnachricht senden
  description: >
    Sendet ein Bild per Direktnachricht oder Bridge (WhatsApp, Signal, Telegram)
    an einen einzelnen Matrix-Benutzer.
  fields:
    user_id:
      name: Benutzer-ID
      description: "Matrix-Benutzer-ID (z. B. @max:matrix.org)."
      required: true
      example: "@max:matrix.org"
      selector:
        text:
    image_path:
      name: Bildpfad
      description: >
        Absoluter Pfad zur Bilddatei auf diesem Home-Assistant-Server
        (muss unter "Zulässige externe Verzeichnisse" erlaubt sein).
      required: true
      example: "/config/www/schnappschuss.jpg"
      selector:
        text:
    message:
      name: Bildunterschrift
      description: Optionaler Text zum Bild.
      required: false
      selector:
        text:
